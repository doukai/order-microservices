syntax = "proto3";

option java_multiple_files = true;
option java_package = "demo.gp.review.grpc";

package demo.gp.review;

import "demo/gp/review/enums.proto";
import "demo/gp/review/objects.proto";
import "demo/gp/review/interfaces.proto";
import "demo/gp/review/input_objects.proto";
import "demo/gp/review/mutation_requests.proto";
import "demo/gp/review/mutation_responses.proto";

/**
* Mutation
*/
service MutationService {
    rpc Review (MutationReviewRequest) returns (MutationReviewResponse); /* Mutation Field for 评论 */
    rpc ReviewList (MutationReviewListRequest) returns (MutationReviewListResponse); /* Mutation Field for 评论 List */
    rpc ReviewUserRelation (MutationReviewUserRelationRequest) returns (MutationReviewUserRelationResponse); /* Mutation Field for Relationship Object between 评论 and 用户 */
    rpc ReviewUserRelationList (MutationReviewUserRelationListRequest) returns (MutationReviewUserRelationListResponse); /* Mutation Field for Relationship Object between 评论 and 用户 List */
}