syntax = "proto3";

option java_multiple_files = true;
option java_package = "demo.gp.order.grpc";

package demo.gp.order;

import "demo/gp/order/enums.proto";
import "demo/gp/order/objects.proto";
import "demo/gp/order/interfaces.proto";
import "demo/gp/order/input_objects.proto";
import "demo/gp/order/mutation_requests.proto";
import "demo/gp/order/mutation_responses.proto";

/**
* Mutation
*/
service MutationService {
    rpc Product (MutationProductRequest) returns (MutationProductResponse); /* Mutation Field for 产品 */
    rpc ProductList (MutationProductListRequest) returns (MutationProductListResponse); /* Mutation Field for 产品 List */
    rpc Order (MutationOrderRequest) returns (MutationOrderResponse); /* Mutation Field for 订单 */
    rpc OrderList (MutationOrderListRequest) returns (MutationOrderListResponse); /* Mutation Field for 订单 List */
    rpc OrderItem (MutationOrderItemRequest) returns (MutationOrderItemResponse); /* Mutation Field for 订单项 */
    rpc OrderItemList (MutationOrderItemListRequest) returns (MutationOrderItemListResponse); /* Mutation Field for 订单项 List */
    rpc OrderOrderItemRelation (MutationOrderOrderItemRelationRequest) returns (MutationOrderOrderItemRelationResponse); /* Mutation Field for Relationship Object between 订单 and 订单项 */
    rpc OrderOrderItemRelationList (MutationOrderOrderItemRelationListRequest) returns (MutationOrderOrderItemRelationListResponse); /* Mutation Field for Relationship Object between 订单 and 订单项 List */
    rpc OrderItemProductRelation (MutationOrderItemProductRelationRequest) returns (MutationOrderItemProductRelationResponse); /* Mutation Field for Relationship Object between 订单项 and 产品 */
    rpc OrderItemProductRelationList (MutationOrderItemProductRelationListRequest) returns (MutationOrderItemProductRelationListResponse); /* Mutation Field for Relationship Object between 订单项 and 产品 List */
    rpc ProductReviewRelation (MutationProductReviewRelationRequest) returns (MutationProductReviewRelationResponse); /* Mutation Field for Relationship Object between 产品 and 评论 */
    rpc ProductReviewRelationList (MutationProductReviewRelationListRequest) returns (MutationProductReviewRelationListResponse); /* Mutation Field for Relationship Object between 产品 and 评论 List */
    rpc OrderUserRelation (MutationOrderUserRelationRequest) returns (MutationOrderUserRelationResponse); /* Mutation Field for Relationship Object between 订单 and 用户 */
    rpc OrderUserRelationList (MutationOrderUserRelationListRequest) returns (MutationOrderUserRelationListResponse); /* Mutation Field for Relationship Object between 订单 and 用户 List */
}