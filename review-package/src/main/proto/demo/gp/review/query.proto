syntax = "proto3";

option java_multiple_files = true;
option java_package = "demo.gp.review.grpc";

package demo.gp.review;

import "demo/gp/review/enums.proto";
import "demo/gp/review/objects.proto";
import "demo/gp/review/interfaces.proto";
import "demo/gp/review/input_objects.proto";
import "demo/gp/review/query_requests.proto";
import "demo/gp/review/query_responses.proto";

/**
* Query
*/
service QueryService {
    rpc Review (QueryReviewRequest) returns (QueryReviewResponse); /* Query Field for 评论 */
    rpc ReviewList (QueryReviewListRequest) returns (QueryReviewListResponse); /* Query Field for 评论 List */
    rpc ReviewConnection (QueryReviewConnectionRequest) returns (QueryReviewConnectionResponse); /* Query Field for 评论 Connection */
    rpc ReviewUserRelation (QueryReviewUserRelationRequest) returns (QueryReviewUserRelationResponse); /* Query Field for Relationship Object between 评论 and 用户 */
    rpc ReviewUserRelationList (QueryReviewUserRelationListRequest) returns (QueryReviewUserRelationListResponse); /* Query Field for Relationship Object between 评论 and 用户 List */
    rpc ReviewUserRelationConnection (QueryReviewUserRelationConnectionRequest) returns (QueryReviewUserRelationConnectionResponse); /* Query Field for Relationship Object between 评论 and 用户 Connection */
}